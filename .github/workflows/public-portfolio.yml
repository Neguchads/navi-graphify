name: Public portfolio bridge
on:
  pull_request:
    branches: [v8]
    paths: ['integrations/portfolio/**', '.github/workflows/public-portfolio.yml']
  push:
    branches: [v8]
    paths: ['integrations/portfolio/**', '.github/workflows/public-portfolio.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s integrations/portfolio -p 'test_*.py'
