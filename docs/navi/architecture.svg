<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">NAVI Graphify data boundaries</title><desc id="desc">Separate local graph and public catalog workflows. Local graphs may feed reviewed Core context; public catalog and sanitized counts feed Homepage and public profile. Abyss is optional.</desc>
<rect x="1" y="1" width="958" height="388" rx="14" fill="#0B111B" stroke="#34516A"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="24" y="31" font-size="13" letter-spacing="2" fill="#45D6FF">NAVI-OS / KNOWLEDGE ARCHITECTURE</text><text x="936" y="31" font-size="12" text-anchor="end" fill="#A9C3D9">CONCEPTUAL MAP</text>
<rect x="24" y="49" width="912" height="137" rx="9" fill="#101D2C" stroke="#34516A"/><text x="40" y="71" font-size="12" letter-spacing="1" fill="#45D6FF">PRIVATE / LOCAL WORKSPACE</text>
<rect x="42" y="86" width="248" height="75" rx="7" fill="#0B111B" stroke="#34516A"/><text x="56" y="113" font-size="17" fill="#EAF4FF" font-weight="700">Project source</text><text x="56" y="137" font-size="13" fill="#A9C3D9">Code / selected documents</text>
<rect x="356" y="86" width="248" height="75" rx="7" fill="#0B111B" stroke="#00B3FF"/><text x="370" y="113" font-size="17" fill="#EAF4FF" font-weight="700">Local Graphify graph</text><text x="370" y="137" font-size="13" fill="#A9C3D9">AST / optional semantic pass</text>
<rect x="670" y="86" width="248" height="75" rx="7" fill="#0B111B" stroke="#34516A"/><text x="684" y="113" font-size="17" fill="#EAF4FF" font-weight="700">NAVI Core / agents</text><text x="684" y="137" font-size="13" fill="#A9C3D9">Reviewed local context</text>
<rect x="24" y="206" width="912" height="137" rx="9" fill="#101D2C" stroke="#34516A"/><text x="40" y="228" font-size="12" letter-spacing="1" fill="#45D6FF">PUBLIC / EXPLICITLY APPROVED DATA</text>
<rect x="42" y="243" width="248" height="75" rx="7" fill="#0B111B" stroke="#34516A"/><text x="56" y="270" font-size="17" fill="#EAF4FF" font-weight="700">Public checkout</text><text x="56" y="294" font-size="13" fill="#A9C3D9">Catalog / code-only scan</text>
<rect x="356" y="243" width="248" height="75" rx="7" fill="#0B111B" stroke="#00B3FF"/><text x="370" y="270" font-size="17" fill="#EAF4FF" font-weight="700">NAVI public contract</text><text x="370" y="294" font-size="13" fill="#A9C3D9">Curated links / numeric counts</text>
